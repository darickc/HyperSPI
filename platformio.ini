;==========================================================
; ESP8266 board
;==========================================================
[esp8266]
platform = espressif8266@4.1.0
lib_deps = https://github.com/awawa-dev/NeoPixelBus.git#HyperSerialESP32
test_ignore = *

[env:esp8266_SK6812_RGBW_COLD]
build_flags = -DNEOPIXEL_RGBW -DCOLD_WHITE ${env.build_flags}
